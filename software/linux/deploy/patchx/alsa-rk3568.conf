# Explicitly selected new-board routes. Do not install as the system default.
# ALSA_CONFIG_PATH must point to this file in the isolated app environment.
</usr/share/alsa/alsa.conf>

pcm.patchx_capture {
    type plug
    slave {
        pcm "hw:CARD=Dongle,DEV=0"
        format S16_LE
        rate 16000
        channels 8
    }
    # Keep only USB channel 0; the default mono policy would sum channels.
    ttable.0.0 1
}

pcm.patchx_playback {
    type plug
    slave {
        pcm "hw:CARD=rockchiprk809co,DEV=0"
        format S16_LE
        rate 48000
        channels 2
    }
    # Duplicate the negotiated mono stream to the two native outputs.
    ttable.0.0 1
    ttable.0.1 1
}
